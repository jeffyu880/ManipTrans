# used to create the object
name: ${concat:ResDexHand,${..side}}

physics_engine: ${..physics_engine}
seed: ${..seed}

# if given, will override the device setting in gym.
env:
  numEnvs: ${resolve_default:8192,${...num_envs}}
  dexhand: ${...dexhand}

  episodeLength: ${fps_scale60:1200,${...demoTargetFps}}  # 1200 @60Hz; scales with demoTargetFps
  maxDemoLength: ${resolve_default:None,${...maxDemoLength}}
  demoTargetFps: ${resolve_default:None,${...demoTargetFps}}  # derives dataset skip; null = native rate
  training: ${if:${...test},False,True}
  # report where the eval failure thresholds would have quit, without quitting — see config.yaml
  evalThresholdDryRun: ${resolve_default:False,${...evalThresholdDryRun}}

  usePIDControl: ${...usePIDControl}

  rolloutStateInit: ${resolve_default:False,${...rolloutStateInit}}
  randomStateInit: ${resolve_default:True,${...randomStateInit}}

  dataIndices: ${resolve_default:[],${...dataIndices}}
  obsFutureLength: 1

  rolloutLen: ${resolve_default:None,${...rolloutLen}}
  rolloutBegin: ${resolve_default:None,${...rolloutBegin}}
  usePenKeypointReward: ${resolve_default:False,${...usePenKeypointReward}}
  useCoaxialReward: ${resolve_default:False,${...useCoaxialReward}}
  zeroResidual: ${resolve_default:False,${...zeroResidual}}
  # replace the policy action with a dex-retargeting solve; needs usePIDControl — see config.yaml
  dexRetBaseline: ${resolve_default:False,${...dexRetBaseline}}
  # which dex-retargeting optimiser the baseline uses: dexpilot | vector — see config.yaml
  dexRetType: ${resolve_default:dexpilot,${...dexRetType}}
  # how the baseline drives the wrist: pid | pd_ff — see config.yaml
  dexRetWristMode: ${resolve_default:pd_ff,${...dexRetWristMode}}
  # fit the wrist to the fingertips instead of the scalar pullback — see config.yaml
  dexRetWristFit: ${resolve_default:True,${...dexRetWristFit}}
  # live only: capture a fresh wrist-fit calibration and exit — see config.yaml
  dexRetCalibrate: ${resolve_default:False,${...dexRetCalibrate}}
  # how often the wrist fit is solved: constant | per_frame — see config.yaml
  dexRetFitMode: ${resolve_default:constant,${...dexRetFitMode}}
  # write the per-step fingertip/contact CSV; off by default — see config.yaml
  logPinch: ${resolve_default:False,${...logPinch}}
  objScaleRH: ${resolve_default:1.0,${...objScaleRH}}
  objScaleLH: ${resolve_default:1.0,${...objScaleLH}}
  # resize the non-scored prop (the cup); scored bodies use objScale* above — see config.yaml
  propScale: ${resolve_default:1.0,${...propScale}}
  sharedObject: ${resolve_default:False,${...sharedObject}}
  # match the frozen imitator's per-step wrist impulse instead of its instantaneous force when
  # running below imitatorFps (smoother, but slower tracking); no-op at the native 60Hz rate
  baseWristImpulseInvariant: ${resolve_default:False,${...baseWristImpulseInvariant}}
  useTrajAug: ${resolve_default:False,${...useTrajAug}}
  RH_LObj_Center_Aug: ${resolve_default:False,${...RH_LObj_Center_Aug}}
  RH_RObj_Center_Aug: ${resolve_default:False,${...RH_RObj_Center_Aug}}
  LH_LObj_Center_Aug: ${resolve_default:False,${...LH_LObj_Center_Aug}}
  # metres; caps the X shift RH_LObj_Center_Aug may cause -- see config.yaml
  rhLObjCenterAugMaxXShift: ${resolve_default:0.05,${...rhLObjCenterAugMaxXShift}}
  RH_LH_Table_Center_Aug: ${resolve_default:False,${...RH_LH_Table_Center_Aug}}
  useObjRotationAug: ${resolve_default:False,${...useObjRotationAug}}
  objRotationAugMaxAngleDeg: ${resolve_default:90.0,${...objRotationAugMaxAngleDeg}}
  numTrajAug: ${resolve_default:20,${...numTrajAug}}
  jointNoiseCm: ${resolve_default:0.0,${...jointNoiseCm}}
  failureThresholdNoiseCompensation: ${resolve_default:1.0,${...failureThresholdNoiseCompensation}}
  evalStartFrame: ${resolve_default:0,${...evalStartFrame}}
  # random action masking; 0.0 disables -- see config.yaml
  actionMaskProb: ${resolve_default:0.0,${...actionMaskProb}}
  actionMaskNumDofs: ${resolve_default:3,${...actionMaskNumDofs}}
  actionMaskMaxDuration: ${resolve_default:10,${...actionMaskMaxDuration}}
  actionMaskRampSteps: ${resolve_default:64000,${...actionMaskRampSteps}}
  # --live: stream targets from the laptop (AVP+Motive) instead of the demo buffer.
  live: ${resolve_default:False,${...live}}
  liveAddr: ${resolve_default:128.178.169.131,${...liveAddr}}
  livePort: ${resolve_default:5555,${...livePort}}
  liveBuffered: ${resolve_default:False,${...liveBuffered}}
  # objectSet: which props are on the table (bottle | cup_brush) — selects the assets each hand
  # spawns, the rigid-body names read off the wire, and any non-scored prop. Live only; offline the
  # loaders infer it from the capture. See main/dataset/object_sets.py.
  objectSet: ${resolve_default:bottle,${...objectSet}}
  # per-step provenance CSV (CSV only, no viewer capture) -- see config.yaml
  recordDemoData: ${resolve_default:False,${...recordDemoData}}
  # additionally capture the viewer to mp4; halves the live control rate -- see config.yaml
  recordDemoVideo: ${resolve_default:False,${...recordDemoVideo}}
  # yellow control-rate readout in the viewer's top-left, live only -- see config.yaml
  liveRateOverlay: ${resolve_default:True,${...liveRateOverlay}}
  # residualGateDistance (metres, LIVE play only; -1 = off): hold each hand's residual at zero while
  # it reaches, then latch it on once that hand's closest fingertip is within this distance of its
  # object (imitator-only approach, residual refines the grasp). ~0.03 m for the capping demos.
  residualGateDistance: ${resolve_default:-1.0,${...residualGateDistance}}
  # metres; -1 = 1.5x the engage distance. Hysteresis so the window cannot chatter -- see config.yaml
  residualGateReleaseDistance: ${resolve_default:-1.0,${...residualGateReleaseDistance}}
  # control steps the residual eases in/out over when the window opens or closes -- see config.yaml
  residualGateFadeSteps: ${resolve_default:12,${...residualGateFadeSteps}}
  liveResidualCutoff: ${resolve_default:True,${...liveResidualCutoff}}
  # draw the viewer every N-th control step (2 = 30 Hz viewer, 60 Hz control; beats vsync quantization)
  renderDecimation: ${resolve_default:2,${...renderDecimation}}
  # viewer debug overlays (green demo skeletons, contact coloring); false = faster live stepping
  debugVis: ${resolve_default:True,${...debugVis}}
  # causal demo velocities (no look-ahead, emulating LiveTargetSource) vs default Gaussian.
  # causalVelMode: pos_ema (smooth positions then diff) | vel_ema (diff then smooth velocity).
  causal: ${resolve_default:False,${...causal}}
  causalVelMode: ${resolve_default:pos_ema,${...causalVelMode}}
  causalEmaAlpha: ${resolve_default:0.3,${...causalEmaAlpha}}

  clipObservations: 5.0
  clipActions: 1.0

  furniture: just_one_leg

  frankaDofNoise: 0.25

  targetLiftHeight: 0.05
  distanceReward: 0.1
  liftReward: 1.0
  successReward: 1.0

  aggregateMode: 3

  tightenMethod: "exp_decay"
  tightenFactor: 0.7 # 1.0 means no tightening restriction
  tightenSteps: 3200

  actionScale: 1.0
  useQuatRot: false

  # for distillation
  propDumpInfo:
    q_rh: ${ndof:${....dexhand}}
    q_lh: ${ndof:${....dexhand}}
    dq_rh: ${ndof:${....dexhand}}
    dq_lh: ${ndof:${....dexhand}}
    state_rh: 13
    state_lh: 13
    state_manip_obj_rh: 13
    state_manip_obj_lh: 13
    joint_state_rh: ${eval:'${nbody:${....dexhand}}*13'}
    joint_state_lh: ${eval:'${nbody:${....dexhand}}*13'}
    tip_force_rh: 15 # todo four fingers
    tip_force_lh: 15
    reward: 1

  actionsMovingAverage: ${...actionsMovingAverage}
  translationScale: 1.0
  orientationScale: 0.1
  # Per-axis safety caps on the applied wrist wrench (N / N*m). An OOD live target saturates the
  # residual wrist channels in one direction; with no angular damping on the free-floating hand
  # base that spins it up. These clamp the final force/torque before it hits the sim. <=0 disables.
  maxWristForce: 12.0
  maxWristTorque: 0.4
  bimanual_mode: ${...bimanual_mode}

  propObsDim: ${is_both_hands:${eval:'13+${ndof:${...dexhand}}*3'},${...side}}
  obsKeys:
    - q
    - cos_q
    - sin_q
    - base_state

  privilegedObsDim: ${is_both_hands:${eval:'${ndof:${...dexhand}}+13+5*4+3+1'},${...side}}
  privilegedObsKeys:
    - dq # must be the first element
    - manip_obj_pos
    - manip_obj_quat
    - manip_obj_vel
    - manip_obj_ang_vel
    - tip_force
    - manip_obj_com
    - manip_obj_weight


  # set to True if you use camera sensors in the environment
  enableCameraSensors: False

sim:
  dt: ${fps_dt:${...demoTargetFps}}              # 1/target_fps (1/60 when demoTargetFps=null)
  substeps: ${fps_substeps:${...demoTargetFps}}  # keeps physics sub-step 1/120s (2 when null)
  up_axis: "z"
  use_gpu_pipeline: ${eq:${...pipeline},"gpu"}
  gravity: [0.0, 0.0, -9.81]
  physx:
    num_threads: ${....num_threads}
    solver_type: ${....solver_type}
    use_gpu: ${contains:"cuda",${....sim_device}} # set to False to run on CPU
    num_position_iterations: 8
    num_velocity_iterations: 1
    contact_offset: 0.005
    rest_offset: 0.0
    bounce_threshold_velocity: 0.2
    max_depenetration_velocity: 1000.0
    default_buffer_size_multiplier: 5.0
    max_gpu_contact_pairs: 4194304 # 2**22
    num_subscenes: ${....num_subscenes}
    contact_collection: 1 # 0: CC_NEVER (don't collect contact info), 1: CC_LAST_SUBSTEP (collect only contacts on last substep), 2: CC_ALL_SUBSTEPS (broken - do not use!)

task:
  randomize: ${if:${...test},False,True}
  randomization_params:
    frequency: 32
    sim_params:
      gravity:
        operation: "scaling"
        schedule: "linear_decay"
        schedule_steps: 1920
        external_sample:
          type: "const_scale"
          init_value: 0
    actor_params:
      manip_obj:
        color: True
        rigid_shape_properties:
          friction:
            num_buckets: 250
            operation: "scaling"
            schedule: "linear_decay"
            schedule_steps: 1920
            external_sample:
              type: "const_scale"
              init_value: 3
              upper_bound: 6.0
              lower_bound: 1.0
      manip_obj_rh:
        color: True
        rigid_shape_properties:
          friction:
            num_buckets: 250
            operation: "scaling"
            schedule: "linear_decay"
            schedule_steps: 1920
            external_sample:
              type: "const_scale"
              init_value: 3
              upper_bound: 6.0
              lower_bound: 1.0
      manip_obj_lh:
        color: True
        rigid_shape_properties:
          friction:
            num_buckets: 250
            operation: "scaling"
            schedule: "linear_decay"
            schedule_steps: 1920
            external_sample:
              type: "const_scale"
              init_value: 3
              upper_bound: 6.0
              lower_bound: 1.0