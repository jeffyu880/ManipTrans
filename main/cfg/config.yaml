# set default task and default training config based on task
defaults:
  - task: ???
  - rl_train: ${find_rl_train_config:${task}}
  - override hydra/job_logging: disabled
  - _self_

# Task name - used to pick the class to load
task_name: ${task.name}
# experiment name. defaults to name of training config
experiment: ''
side: 'Local'
bimanual_mode: united
dexhand: inspire
rh_base_model_checkpoint: assets/imitator_rh_inspire.pth
lh_base_model_checkpoint: assets/imitator_lh_inspire.pth

# if set to positive integer, overrides the default number of environments
num_envs: ''
rolloutStateInit: False
randomStateInit: True

rolloutLen: null
rolloutBegin: null
maxDemoLength: null
# demoTargetFps: training demo rate (Hz); derives skip = round(native_fps / demoTargetFps) so the raw
# and retarget subsample together. null = use each dataset's native skip default (mydataset 60Hz).
demoTargetFps: null

learning_rate: 5e-4
actionsMovingAverage: 1.0

usePIDControl: False
usePenKeypointReward: False
useCoaxialReward: False
zeroResidual: False
baseWristImpulseInvariant: False
useTrajAug: False
useLHObjCenterAug: False
useRHObjCenterAug: False
useLHAboutLHObjAug: False
useTableCenterAug: False
numTrajAug: 20
jointNoiseCm: 0.0
# noise to add to the joint positions
# obsHandNoise: 0.0
# obsHandVelNoise: 0.0
failureThresholdNoiseCompensation: 1.0
# multiplier on finger failure thresholds; 1.0 = no change, >1 loosens to compensate for injected joint noise
evalStartFrame: 0

# --live: stream targets live from the laptop (AVP+Motive) instead of the preloaded demo.
# A reference demo is still loaded (assets/BPS/opt-init); its target slots are overwritten
# each step with the live frame. liveAddr = laptop's IP that the desktop SUB connects to.
live: False
liveAddr: 128.178.169.131
livePort: 5555
# liveBuffered: consume EVERY published frame in order (faithful trajectory replay, e.g. with
# mock_publish); false = newest-only/CONFLATE (real-time teleop, may skip frames).
liveBuffered: False
# liveResidualCutoff: zero the residual action once the cap is seated on the bottle (live object
# poses within 5 mm vertically and 2 cm in-plane), leaving the frozen imitators in control.
liveResidualCutoff: True
# renderDecimation: draw the viewer only every N-th control step (1 = every step). GL vsync in
# draw_viewer otherwise quantizes each control step to the display refresh, halving the control
# rate; 2 = viewer at 30 Hz with control at 60 Hz (keeps newest-only live streaming real-time).
renderDecimation: 4
# debugVis: viewer debug overlays (green demo skeletons, per-body contact coloring). Costs several
# ms/step in Python at 1 env — set false for real-time live runs.
debugVis: True

# causal: compute demo velocities causally (no look-ahead) instead of the default non-causal
# np.gradient + Gaussian filter. Emulates LiveTargetSource so offline targets match the live
# stream. causalVelMode selects the causal method for LINEAR velocities (angular always vel_ema):
#   pos_ema — low-pass positions (EMA), then backward-diff (smoother; recommended).
#   vel_ema — backward-diff, then EMA the velocity (the original causal path).
# causalEmaAlpha = smoothing strength (position EMA in pos_ema; velocity EMA in vel_ema).
causal: False
causalVelMode: pos_ema
causalEmaAlpha: 0.3

dataIndices: [7]

# seed - set to -1 to choose random seed
seed: 42
# set to True for deterministic performance
torch_deterministic: False

# set the maximum number of learning iterations to train for. overrides default per-environment setting
max_iterations: 9999999999999  # train forever
early_stop_epochs: 9999999999999

## Device config
#  'physx' or 'flex'
physics_engine: 'physx'
# whether to use cpu or gpu pipeline
pipeline: 'gpu'
# device for running physics simulation
sim_device: 'cuda:0'
# device to run RL
rl_device: 'cuda:0'
graphics_device_id: 0

## PhysX arguments
num_threads: 4 # Number of worker threads per scene used by PhysX - for CPU PhysX only.
solver_type: 1 # 0: pgs, 1: tgs
num_subscenes: 4 # Splits the simulation into N physics scenes and runs each one in a separate thread

# RLGames Arguments
# test - if set, run policy in inference mode (requires setting checkpoint to load)
test: False
# save rollouts config, used for distillation
save_rollouts: False
save_successful_rollouts_only: True
num_rollouts_to_save: 10
num_rollouts_to_run: 10
min_episode_length: 20
# used to set checkpoint path
checkpoint: ''
from_ckpt_epoch: false
# set sigma when restoring network
sigma: ''
# set to True to use multi-gpu training
multi_gpu: False

wandb_activate: False
wandb_group: ''
wandb_name: ${rl_train.params.config.name}
wandb_entity: null  # set to your wandb entity if using wandb
wandb_project: null  # set to your wandb project if using wandb
wandb_tags: []
wandb_logcode_dir: '' 

capture_video: False
n_parallel_recorders: 1
n_successful_videos_to_record: 5
plot_trajectories: False
n_traj_episodes: 10
display: False
headless: True

# set the directory where the output files get saved
hydra:
  output_subdir: null
  run:
    dir: .
