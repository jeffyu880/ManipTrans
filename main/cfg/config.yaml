# set default task and default training config based on task
defaults:
  - task: ???
  - rl_train: ${find_rl_train_config:${task}}
  - override hydra/job_logging: disabled
  - _self_

# Task name - used to pick the class to load
task_name: ${task.name}
# experiment name. defaults to name of training config
experiment: ''
side: 'Local'
bimanual_mode: united
dexhand: inspire
rh_base_model_checkpoint: assets/imitator_rh_inspire.pth
lh_base_model_checkpoint: assets/imitator_lh_inspire.pth

# if set to positive integer, overrides the default number of environments
num_envs: ''
rolloutStateInit: False
randomStateInit: True

rolloutLen: null
rolloutBegin: null
maxDemoLength: null
# demoTargetFps: training demo rate (Hz); derives skip = round(native_fps / demoTargetFps) so the raw
# and retarget subsample together. null = use each dataset's native skip default (mydataset 60Hz).
demoTargetFps: null

learning_rate: 5e-4
actionsMovingAverage: 1.0

usePIDControl: False
# The frozen imitators normally SAMPLE their base action from Normal(mu, sigma) on every step,
# including at test time (the residual policy itself always uses mu when player.deterministic).
# The imitator sigma is large on the finger DOFs (~0.5 of the [-1,1] range), so this is the main
# source of run-to-run variation. True -> use mu instead, making the base action deterministic.
# Note the residual was TRAINED against sampled base actions and receives them as input, so
# flipping this at test time is a distribution shift: compare both ways rather than assuming.
deterministicBaseAction: False
usePenKeypointReward: False
useCoaxialReward: False
zeroResidual: False
# dexRetBaseline: replace the policy's action with a per-frame dex-retargeting solve
# (baselines/dexret_controller.py) — the no-RL comparison point, scored by the same physics,
# termination and logging. This is the ONLY flag needed to turn the baseline on: every other
# dexRet* knob already defaults to the recommended value. Pair with zeroResidual=True if you want
# belt-and-braces (the policy contributes nothing regardless). Only dexRetWristMode=pid needs
# usePIDControl=True; the default pd_ff needs it False, which is also the default. Solves per env
# per step in Python, so keep num_envs at test scale (4-16).
dexRetBaseline: False
# dexRetType: which dex-retargeting optimiser the baseline solves with. dexpilot = inter-finger
# vectors plus DexPilot's thumb-to-finger projection (Bunny-VisionPro's choice); vector = the five
# wrist-to-fingertip vectors only. The projection stabilises grasps but pins thumb_proximal_yaw at
# its limit whenever the human's grip is tight, so switch to vector if you need the thumb to track.
dexRetType: dexpilot
# dexRetWristMode: how the dex-retargeting baseline drives the wrist.
#   pid   — the env's PID branch (usePIDControl=True). Gains live on the dexhand class, are
#           shared with every other PID run, and the RH's are forced onto BOTH hands. It is
#           handed a position error only, so it cannot know the target is moving.
#   pd_ff — the controller emits wrist force/torque directly (usePIDControl=False), with PD
#           gains it owns, asset-drag compensation, and causal velocity feedforward. Tunable
#           without touching shared code. Constants at the top of baselines/dexret_controller.py.
# pd_ff is the default because it is the only one consistent with the other defaults: "pid" asserts
# usePIDControl=true, which defaults to False, so `dexRetBaseline=true` on its own used to abort.
dexRetWristMode: pd_ff
# dexRetWristFit: place the wrist by solving the rigid transform that puts the robot's fingertips
# on the human's (baselines/utils/wrist_fit.py), instead of the scalar pullback. The fingers are
# already solved by the time this runs, so it is a closed-form Procrustes fit — no gains, nothing
# to tune. Supersedes DEXRET_WRIST_PULLBACK when on, and is ignored by dexRetType=position /
# position_free, whose free joint already solves its own placement.
dexRetWristFit: True
# dexRetCalibrate: live only. Capture a fresh wrist-fit calibration this run and write it to
# data/dexret_calibration/<dexhand>_<dexRetType>.json, then exit. Move both hands through the
# motion you intend to teleoperate while it captures — the constant is a median over what it sees,
# so holding one pose calibrates only that pose. Every later live run loads the file and is correct
# from the first frame; without one, a live run captures a calibration first and says so.
# Offline runs ignore this: there the demo itself is the calibration source.
dexRetCalibrate: False
# dexRetFitMode: how often the wrist fit is solved.
#   constant  — solve once (offline: a pre-pass over the demo; live: a calibration capture, see
#               dexRetCalibrate) and hold it. Free at runtime, smooth by construction.
#   per_frame — re-solve every control step. Tracks how the correction should change through the
#               motion, which a constant cannot: measured on the capping lift, freezing it costs
#               ~10 mm of the wrist's vertical travel. Costs 0.12 ms/hand against 0.04, so ~0.16 ms
#               more per control step out of 16.7 ms at 60 Hz. Needs NO calibration in live mode.
#               Caveat: the per-frame solve is not smooth — a near-coplanar fingertip cloud makes
#               the rotation ill-conditioned and one frame of the capping demo jumped 73 mm.
dexRetFitMode: constant
# logPinch: write the per-step fingertip/contact CSV (_log_pinch_gap). OFF by default in every
# mode, live included — it is a diagnostic, not something a run should produce unasked. The path
# comes from MANIPTRANS_PINCH_CSV; without it the file lands in the CWD as pinch_gap.csv.
logPinch: False
# multiplier on each hand's object scale (1.0 = the asset's own scale). Upscaling the object makes
# the hand contact it before reaching the commanded finger pose, which is what turns a PD position
# target into grip force — see the imitator-only ablation. The object's mass is held at its
# unscaled value, so only the geometry changes, not the weight.
objScaleRH: 1.0
objScaleLH: 1.0
# sharedObject: REWARD ONLY. When both hands manipulate one body, the object reward terms would
# otherwise be paid twice — once per hand. With this on they are split by the demo's fingertip
# proximity, so the object is credited once in total and to whichever hand is holding it (see
# _object_reward_shares). Set it whenever both hands score the same body.
# It no longer affects spawning: the env infers that from the objects themselves — both sides
# resolving to the same body means ONE scored actor (two overlapping copies is never a valid
# scene), and any non-scored prop the object set declares is spawned regardless.
sharedObject: False
baseWristImpulseInvariant: False
useTrajAug: False
RH_LObj_Center_Aug: False
# Budget in METRES on how far RH_LObj_Center_Aug may move the demo's STARTING position along world
# X. Only the start pose is bounded -- the augmented trajectory may diverge further later on, which
# is what leaves the aug any effect. That aug rotates the RH demo about the LH object, so the shift
# is linear in the starting lever arm (start-hand-to-LH-object distance): the same angle moves a
# demo that starts far out much further than a close one. The yaw is therefore drawn PER DEMO by
# rejection sampling from a symmetric [-15, +15] deg range (not the [-15, +30] the other aug types
# share), keeping the first draw whose start-pose |ΔX| is within this budget -- so far-starting
# demos automatically end up with smaller angles.
# Raise it for more aggressive aug, lower it to pin the augmented start nearer the demonstrated one.
# Only read when RH_LObj_Center_Aug=true; RH_RObj_Center_Aug and LH_LObj_Center_Aug are
# unconstrained.
rhLObjCenterAugMaxXShift: 0.05
RH_RObj_Center_Aug: False
LH_LObj_Center_Aug: False
RH_LH_Table_Center_Aug: False
useObjRotationAug: False
objRotationAugMaxAngleDeg: 90.0
numTrajAug: 20
jointNoiseCm: 0.0
# noise to add to the joint positions
# obsHandNoise: 0.0
# obsHandVelNoise: 0.0
failureThresholdNoiseCompensation: 1.0
# multiplier on finger failure thresholds; 1.0 = no change, >1 loosens to compensate for injected joint noise
evalStartFrame: 0

# --live: stream targets live from the laptop (AVP+Motive) instead of the preloaded demo.
# A reference demo is still loaded (assets/BPS/opt-init); its target slots are overwritten
# each step with the live frame. liveAddr = laptop's IP that the desktop SUB connects to.
live: False
liveAddr: 128.178.169.131
livePort: 5555
# liveBuffered: consume EVERY published frame in order (faithful trajectory replay, e.g. with
# mock_publish); false = newest-only/CONFLATE (real-time teleop, may skip frames).
liveBuffered: False
# objectSet: which props are on the table. OFFLINE this is inferred from what the capture recorded,
# so this value is ignored; LIVE there is no pkl to infer from, so it selects the set. It picks the
# assets each hand spawns, the Motive rigid-body names read out of each wire frame, and which body
# (if any) is a non-scored prop.
#   bottle    — OakInk-v2 alcohol burner: LH = bottle_body, RH = bottle_cap, no prop
#   cup_brush — BOTH hands manipulate d2_brush; d2_cup is a prop (spawned and collided with, but
#               never a reward or failure target). Pair with sharedObject=true.
# Sets are defined in main/dataset/object_sets.py.
objectSet: bottle
# recordLive: during a live run, capture the viewer and encode an mp4 next to the pinch CSV.
# Needs a viewer (headless: false). Shares the pinch log's lifecycle: the reset key starts it and
# each further press discards the frames so far, so the video always matches the CSV.
recordLive: False
# residualGateDistance (metres, LIVE play only; -1 = off): hold each hand's residual at zero while
# it reaches, latch it on once that hand's closest fingertip is within this distance of its object.
residualGateDistance: -1.0
# liveResidualCutoff: zero the residual action once the cap is seated on the bottle (live object
# poses within 5 mm vertically and 2 cm in-plane), leaving the frozen imitators in control.
liveResidualCutoff: True
# renderDecimation: draw the viewer only every N-th control step (1 = every step). GL vsync in
# draw_viewer otherwise quantizes each control step to the display refresh, halving the control
# rate; 2 = viewer at 30 Hz with control at 60 Hz (keeps newest-only live streaming real-time).
renderDecimation: 4
# debugVis: viewer debug overlays (green demo skeletons, per-body contact coloring). Costs several
# ms/step in Python at 1 env — set false for real-time live runs.
debugVis: True

# causal: compute demo velocities causally (no look-ahead) instead of the default non-causal
# np.gradient + Gaussian filter. Emulates LiveTargetSource so offline targets match the live
# stream. causalVelMode selects the causal method for LINEAR velocities (angular always vel_ema):
#   pos_ema — low-pass positions (EMA), then backward-diff (smoother; recommended).
#   vel_ema — backward-diff, then EMA the velocity (the original causal path).
# causalEmaAlpha = smoothing strength (position EMA in pos_ema; velocity EMA in vel_ema).
causal: False
causalVelMode: pos_ema
causalEmaAlpha: 0.3

dataIndices: [7]

# seed - set to -1 to choose random seed
seed: 42
# set to True for deterministic performance
torch_deterministic: False

# set the maximum number of learning iterations to train for. overrides default per-environment setting
max_iterations: 9999999999999  # train forever
early_stop_epochs: 9999999999999
# minSaveEpoch: no intermediate checkpoint (periodic or new-best) is written below this epoch.
# The terminal saves (early stop / max_epochs / max_frames) always write, so a short run still
# leaves a .pth behind. Set 0 to restore the old save-from-the-start behaviour.
min_save_epoch: 700

## Device config
#  'physx' or 'flex'
physics_engine: 'physx'
# whether to use cpu or gpu pipeline
pipeline: 'gpu'
# device for running physics simulation
sim_device: 'cuda:0'
# device to run RL
rl_device: 'cuda:0'
graphics_device_id: 0

## PhysX arguments
num_threads: 4 # Number of worker threads per scene used by PhysX - for CPU PhysX only.
solver_type: 1 # 0: pgs, 1: tgs
num_subscenes: 4 # Splits the simulation into N physics scenes and runs each one in a separate thread

# RLGames Arguments
# test - if set, run policy in inference mode (requires setting checkpoint to load)
test: False
# save rollouts config, used for distillation
save_rollouts: False
save_successful_rollouts_only: True
num_rollouts_to_save: 10
num_rollouts_to_run: 10
min_episode_length: 20
# used to set checkpoint path
checkpoint: ''
from_ckpt_epoch: false
# set sigma when restoring network
sigma: ''
# set to True to use multi-gpu training
multi_gpu: False

wandb_activate: False
wandb_group: ''
wandb_name: ${rl_train.params.config.name}
wandb_entity: null  # set to your wandb entity if using wandb
wandb_project: null  # set to your wandb project if using wandb
wandb_tags: []
wandb_logcode_dir: '' 

capture_video: False
n_parallel_recorders: 1
n_successful_videos_to_record: 5
plot_trajectories: False
n_traj_episodes: 10
display: False
headless: True

# set the directory where the output files get saved
hydra:
  output_subdir: null
  run:
    dir: .
