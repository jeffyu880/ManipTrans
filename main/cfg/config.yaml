# set default task and default training config based on task
defaults:
  - task: ???
  - rl_train: ${find_rl_train_config:${task}}
  - override hydra/job_logging: disabled
  - _self_

# Task name - used to pick the class to load
task_name: ${task.name}
# experiment name. defaults to name of training config
experiment: ''
side: 'Local'
bimanual_mode: united
dexhand: inspire
rh_base_model_checkpoint: assets/imitator_rh_inspire.pth
lh_base_model_checkpoint: assets/imitator_lh_inspire.pth

# if set to positive integer, overrides the default number of environments
num_envs: ''
rolloutStateInit: False
randomStateInit: True

rolloutLen: null
rolloutBegin: null
maxDemoLength: null
# demoTargetFps: training demo rate (Hz); derives skip = round(native_fps / demoTargetFps) so the raw
# and retarget subsample together. null = use each dataset's native skip default (mydataset 60Hz).
demoTargetFps: null

learning_rate: 5e-4
actionsMovingAverage: 1.0

usePIDControl: False
# The frozen imitators normally SAMPLE their base action from Normal(mu, sigma) on every step,
# including at test time (the residual policy itself always uses mu when player.deterministic).
# The imitator sigma is large on the finger DOFs (~0.5 of the [-1,1] range), so this is the main
# source of run-to-run variation. True -> use mu instead, making the base action deterministic.
# Note the residual was TRAINED against sampled base actions and receives them as input, so
# flipping this at test time is a distribution shift: compare both ways rather than assuming.
deterministicBaseAction: False
usePenKeypointReward: False
useCoaxialReward: False
zeroResidual: False
# dexRetBaseline: replace the policy's action with a per-frame dex-retargeting solve
# (baselines/dexret_controller.py) — the no-RL comparison point, scored by the same physics,
# termination and logging. This is the ONLY flag needed to turn the baseline on: every other
# dexRet* knob already defaults to the recommended value. Pair with zeroResidual=True if you want
# belt-and-braces (the policy contributes nothing regardless). Only dexRetWristMode=pid needs
# usePIDControl=True; the default pd_ff needs it False, which is also the default. Solves per env
# per step in Python, so keep num_envs at test scale (4-16).
dexRetBaseline: False
# dexRetType: which dex-retargeting optimiser the baseline solves with. dexpilot = inter-finger
# vectors plus DexPilot's thumb-to-finger projection (Bunny-VisionPro's choice); vector = the five
# wrist-to-fingertip vectors only. The projection stabilises grasps but pins thumb_proximal_yaw at
# its limit whenever the human's grip is tight, so switch to vector if you need the thumb to track.
dexRetType: dexpilot
# dexRetWristMode: how the dex-retargeting baseline drives the wrist.
#   pid   — the env's PID branch (usePIDControl=True). Gains live on the dexhand class, are
#           shared with every other PID run, and the RH's are forced onto BOTH hands. It is
#           handed a position error only, so it cannot know the target is moving.
#   pd_ff — the controller emits wrist force/torque directly (usePIDControl=False), with PD
#           gains it owns, asset-drag compensation, and causal velocity feedforward. Tunable
#           without touching shared code. Constants at the top of baselines/dexret_controller.py.
# pd_ff is the default because it is the only one consistent with the other defaults: "pid" asserts
# usePIDControl=true, which defaults to False, so `dexRetBaseline=true` on its own used to abort.
dexRetWristMode: pd_ff
# dexRetWristFit: place the wrist by solving the rigid transform that puts the robot's fingertips
# on the human's (baselines/utils/wrist_fit.py), instead of the scalar pullback. The fingers are
# already solved by the time this runs, so it is a closed-form Procrustes fit — no gains, nothing
# to tune. Supersedes DEXRET_WRIST_PULLBACK when on, and is ignored by dexRetType=position /
# position_free, whose free joint already solves its own placement.
dexRetWristFit: True
# dexRetCalibrate: live only. Capture a fresh wrist-fit calibration this run and write it to
# data/dexret_calibration/<dexhand>_<dexRetType>.json, then exit. Move both hands through the
# motion you intend to teleoperate while it captures — the constant is a median over what it sees,
# so holding one pose calibrates only that pose. Every later live run loads the file and is correct
# from the first frame; without one, a live run captures a calibration first and says so.
# Offline runs ignore this: there the demo itself is the calibration source.
dexRetCalibrate: False
# dexRetFitMode: how often the wrist fit is solved.
#   constant  — solve once (offline: a pre-pass over the demo; live: a calibration capture, see
#               dexRetCalibrate) and hold it. Free at runtime, smooth by construction.
#   per_frame — re-solve every control step. Tracks how the correction should change through the
#               motion, which a constant cannot: measured on the capping lift, freezing it costs
#               ~10 mm of the wrist's vertical travel. Costs 0.12 ms/hand against 0.04, so ~0.16 ms
#               more per control step out of 16.7 ms at 60 Hz. Needs NO calibration in live mode.
#               Caveat: the per-frame solve is not smooth — a near-coplanar fingertip cloud makes
#               the rotation ill-conditioned and one frame of the capping demo jumped 73 mm.
dexRetFitMode: constant
# logPinch: write the per-step fingertip/contact CSV (_log_pinch_gap). OFF by default in every
# mode, live included — it is a diagnostic, not something a run should produce unasked. The path
# comes from MANIPTRANS_PINCH_CSV; without it the file lands in the CWD as pinch_gap.csv.
logPinch: False
# multiplier on each hand's object scale (1.0 = the asset's own scale). Upscaling the object makes
# the hand contact it before reaching the commanded finger pose, which is what turns a PD position
# target into grip force — see the imitator-only ablation. The object's mass is held at its
# unscaled value, so only the geometry changes, not the weight.
objScaleRH: 1.0
objScaleLH: 1.0
# multiplier on the NON-SCORED prop's asset scale (1.0 = the asset's own scale). objScaleRH/LH above
# only reach the scored bodies, which for the cup_brush set is the brush -- this is the only way to
# resize the cup. Geometry only: the cup_brush prop is prop_static (main/dataset/object_sets.py), so
# it is pinned and its mass never enters the solver; for a movable prop the explicit
# my_dataset_obj_mass value is still written after the scale, so weight stays put there too. The
# prop's mesh origin IS its base, so >1 grows it upward off the table rather than into it. NOTE the
# demo's brush trajectory is unchanged, so a value != 1.0 is a ROBUSTNESS test -- the policy is
# asked to hit the same waypoints with a differently sized receptacle.
propScale: 1.0
# sharedObject: REWARD ONLY. When both hands manipulate one body, the object reward terms would
# otherwise be paid twice — once per hand. With this on they are split by the demo's fingertip
# proximity, so the object is credited once in total and to whichever hand is holding it (see
# _object_reward_shares). Set it whenever both hands score the same body.
# It no longer affects spawning: the env infers that from the objects themselves — both sides
# resolving to the same body means ONE scored actor (two overlapping copies is never a valid
# scene), and any non-scored prop the object set declares is spawned regardless.
sharedObject: False
baseWristImpulseInvariant: False
useTrajAug: False
RH_LObj_Center_Aug: False
# Budget in METRES on how far RH_LObj_Center_Aug may move the demo's STARTING position along world
# X. Only the start pose is bounded -- the augmented trajectory may diverge further later on, which
# is what leaves the aug any effect. That aug rotates the RH demo about the LH object, so the shift
# is linear in the starting lever arm (start-hand-to-LH-object distance): the same angle moves a
# demo that starts far out much further than a close one. The yaw is therefore drawn PER DEMO by
# rejection sampling from a symmetric [-15, +15] deg range (not the [-15, +30] the other aug types
# share), keeping the first draw whose start-pose |ΔX| is within this budget -- so far-starting
# demos automatically end up with smaller angles.
# Raise it for more aggressive aug, lower it to pin the augmented start nearer the demonstrated one.
# Only read when RH_LObj_Center_Aug=true; RH_RObj_Center_Aug and LH_LObj_Center_Aug are
# unconstrained.
rhLObjCenterAugMaxXShift: 0.05
RH_RObj_Center_Aug: False
LH_LObj_Center_Aug: False
RH_LH_Table_Center_Aug: False
useObjRotationAug: False
objRotationAugMaxAngleDeg: 90.0
numTrajAug: 20
jointNoiseCm: 0.0
# noise to add to the joint positions
# obsHandNoise: 0.0
# obsHandVelNoise: 0.0
failureThresholdNoiseCompensation: 1.0
# multiplier on finger failure thresholds; 1.0 = no change, >1 loosens to compensate for injected joint noise
evalStartFrame: 0

# Random action masking (TeleDexter, arXiv 2607.11481 Sec. C.8): each step, when no mask is
# active, with probability actionMaskProb freeze actionMaskNumDofs randomly chosen DoFs PER HAND
# at their previously commanded target for a duration drawn from U{1, d_max}. d_max ramps 1 ->
# actionMaskMaxDuration cubically over actionMaskRampSteps control steps, so the policy meets
# short stalls first. Forcing it to succeed with partially stale joint commands stops it relying
# on perfectly synchronised actuation. actionMaskProb: 0.0 disables (paper uses 0.15).
# Training only -- skipped when test=true, like the domain-randomization block.
actionMaskProb: 0.0
actionMaskNumDofs: 3
actionMaskMaxDuration: 10
# 64000 ~= 20% of a 10000-iteration run at horizon_length 32, matching the fraction of training
# over which the paper's ramp completes (its own 25600 is tuned to a much longer schedule).
actionMaskRampSteps: 64000

# Consecutive subgoal co-tracking (TeleDexter, arXiv 2607.11481 Sec. 3.1 + C.2-C.4). Default OFF,
# which reproduces today's dense frame-wise tracking exactly. When on, the demo pointer
# (progress_buf) stops advancing one frame per control step and instead JUMPS delta_k frames only
# once the current subgoal has been held inside tolerance for subgoalStayMin..Max frames. Between
# subgoals the policy is free to leave the reference and find its own contact strategy, which is
# what the paper credits for in-hand reorientation / finger gaiting / regrasping (its Tab. 4:
# episode length 373-379 vs 89-131, subgoals reached 33-187 vs ~2.7 against dense tracking).
# The observation is unchanged -- `target` already carries the reference target, so it follows the
# subgoal pointer for free. Training only, like the action-mask and DR blocks.
subgoalTracking: False
# Reach tolerances. A subgoal counts as instantaneously reached when EVERY fingertip of BOTH hands,
# plus both object positions and rotations, are simultaneously inside these. They are additionally
# multiplied by the existing `tightenFactor` schedule, which is already the paper's "tolerances
# start permissive and tighten over training" knob.
# NOT the paper's Tab. 8 (3 cm / 1 cm / 10 deg). Those are a single hand on an IK-driven wrist doing
# in-hand manipulation of one well-grasped object. Here the reach test is a conjunction over TEN
# fingertips and TWO object poses, and the policy drives both wrists. These are instead pinned to
# this repo's own dense-mode failure ladder (compute_imitation_reward, `elif training`): finger
# 0.04-0.06 m, object 0.02 m / 30 deg. That ladder is the calibrated "still tracking acceptably"
# bar for this task, so a subgoal hit asks for exactly what dense training already demands rather
# than 2-3x tighter, which would leave the sparse bonus never firing. They also carry the SAME
# /0.7*s and /0.343*s**3 tighten scaling as that ladder, so the two schedules now coincide exactly.
subgoalTipTol: 0.05        # m, per fingertip group (middle of the 0.04-0.06 failure ladder)
subgoalObjPosTol: 0.02     # m  (= the dense-mode object-position failure threshold)
subgoalObjRotTolDeg: 30.0  # deg (= the dense-mode object-rotation failure threshold)
# Dwell: N_stay ~ U{min, max} frames of continuous in-tolerance before the hit fires, resampled
# after every hit. Stops the policy scoring a subgoal by flying through the tolerance ball.
subgoalStayMin: 5
subgoalStayMax: 15
# Inter-subgoal jump delta_k ~ U{min, max_t}, in reference frames at 60 Hz. max_t ramps from min to
# subgoalStepMax cubically over subgoalRampSteps (same sigma: 1 -> 0.7 curve as the action mask),
# so the policy masters short hops before long ones.
# NOT the paper's 40 -> 80: those are 600-frame free-play clips with the wrist IK-driven outside the
# policy. Here demos measure min 96 / median 346 / max 584 frames and the policy drives the wrist
# itself, so fraction-matching gives ~23 -> 45 and we halve it again for the floating wrist.
# 8 -> 24 is ~14 subgoal hits across a median-length demo.
subgoalStepMin: 8
subgoalStepMax: 24
subgoalRampSteps: 64000
# Failure tolerance eta_fail: the episode ends after eta_fail * delta_k out-of-tolerance frames
# since the last hit. This REPLACES the per-finger instant-termination ladder while subgoal mode is
# on -- leaving the reference between subgoals is the point, so tripping a threshold cannot end the
# episode on the spot. The velocity sanity checks and a 15 cm object-position bail still do.
# NOT the paper's 1.5: eta_fail is a RATIO, and delta_k above was scaled down ~5x from the paper's
# 40-80, so 1.5 would buy a budget of only 12-36 frames. Reaching a subgoal delta_k frames ahead
# costs at least delta_k out-of-tolerance control steps by construction, so the policy would be
# terminating with barely any slack over the travel itself. 6.0 gives 48-144 frames, restoring the
# paper's ABSOLUTE budget (60-120) rather than its ratio.
subgoalFailTolerance: 6.0
# Sparse subgoal bonus paid on a hit:
#   w_step * alpha_s * (w_tip * sum_f exp(-beta_f e_f)
#                       + w_obj * (exp(-beta_pos e_pos) + exp(-beta_rot e_rot)))
# with w_step = delta_k + 5, so a longer jump pays proportionally more and the policy is not biased
# toward trivially close subgoals. beta_* are the existing reward kernels, unchanged.
subgoalScoreScale: 1.5     # alpha_s
subgoalTipWeight: 0.5      # w_tip, per fingertip group
subgoalObjWeight: 2.0      # w_obj, applied to object position and rotation
# Per-step cost, so the policy completes subgoals rather than parking in a locally stable pose.
subgoalTimePenalty: 0.1
# Cross-trajectory switching (TeleDexter Sec. C.4, Eq. 9). On a subgoal hit, with probability
# subgoalCrossTrajProb the env does NOT jump delta_k ahead in its own demo -- it keeps the frame
# index and swaps onto ANOTHER demo's reference at that same index, so the next subgoal is a
# different demonstration's hand-object configuration. This is the "traj:031 -> traj:014 -> ..."
# row in the paper's Fig. 2. Its purpose is to stop the policy overfitting to one demo and to make
# it handle a target that jumps off the trajectory it was following -- which is exactly what a live
# operator does, since their motion never stays inside any recorded clip.
# 0.0 = OFF and the DEFAULT, which reproduces pure in-trajectory subgoal tracking. The paper uses
# 0.1; that is the value to pass with subgoalTracking=true. Needs >= 2 demos in dataIndices (or
# scope=any with augmentation on) -- with nothing to switch to it silently stays off.
subgoalCrossTrajProb: 0.0
# Which demo rows an env may switch onto. Envs sharing a (demo, augmentation variant) slot hold
# identical packed rows, so the pool carries one representative row per slot.
#   aug -- same augmentation variant, DIFFERENT base demo. The paper's case: several demonstrations
#          of one task in one scene frame. Holding the scene transform fixed keeps the swapped-in
#          object target somewhere the hand can plausibly take the object.
#   any -- any other slot, including other augmentation variants. This is the only scope that does
#          anything with a SINGLE demo plus numTrajAug, but note what it asks for: variants are
#          whole-scene rotations about the table centre, and _aug_demo_table_center rotates the
#          manipulated object's trajectory while leaving prop_trajectory (the static bottle/cup)
#          where it is. So a switch across variants can demand an object pose tens of degrees away
#          from anything this env's own demo visits, and defined relative to a scene layout this
#          env does not have. Much harder, and only sensible for small rotations or prop-free
#          scenes; use deliberately.
# A row is admissible either way only if its object ids match on BOTH hands: the switch swaps the
# TARGET trajectory, never the object actor, so the env keeps manipulating its own body.
subgoalCrossTrajScope: aug
# w_step paid for a subgoal reached after a cross-trajectory switch. In-trajectory hits pay
# delta_k + 5 (a longer jump earns proportionally more); a switch is not measured in frames, so it
# takes the paper's flat Tab. 8 value instead. 100 against an in-traj 13-29 makes crossing to
# another demo worth roughly 4-8 ordinary subgoals, which is the intent -- the transition is the
# hard part and the sparse bonus is where the policy learns it.
subgoalCrossTrajStepWeight: 100.0
# n_fail budget for the first subgoal after a switch, in out-of-tolerance frames, replacing the
# usual eta_fail * delta_k. A switch can land the target far from where the object currently is, so
# the regrasp/transport that follows takes much longer than an ordinary delta_k hop and the
# proportional budget would end the episode mid-transition. The paper's flat 300 frames.
subgoalCrossTrajFailBudget: 300
# progress_buf no longer paces the episode (it holds still between hits), so vec_task's
# max_episode_length timeout can never fire. This caps running_progress_buf instead, keeping PPO's
# value bootstrapping alive.
# 1200, not 600: a median 346-frame demo needs 346/delta_k = 14 (late) to 43 (early curriculum)
# hits, each costing N_stay (5-15) plus the travel, so 600 truncates most episodes well before the
# last subgoal and the success signal would almost never be seen. 1200 = 20 s at 60 Hz.
subgoalMaxEpisodeSteps: 1200
# Multiplier on the existing dense imitation reward, i.e. the paper's alpha_dense. 1.0 is an exact
# no-op and the DEFAULT, because subgoalTracking is off by default and 1.0 must stay the identity
# there. With subgoalTracking=true pass ~0.02 on the command line:
#   paper   sparse per hit (|dk|+5) * r_score = 65 * 9.75  = 634   vs dense 0.82/step -> ratio 773
#   here    sparse per hit         21 * 13.5             = 284   (r_score summed over both hands,
#           object half paid once via obj_reward_share), and reward_execute peaks at 27.6 per hand
#           = 35.0 summed, so exact ratio parity is alpha_dense = 0.0105.
# 0.02 doubles the dense side of that on purpose: TeleDexter trains with SAPG and reports vanilla
# PPO dropping substantially on both reward and consecutive successes, so the shaping term is worth
# more here than there. Leaving it at 1.0 buries the sparse bonus outright.
denseRewardScale: 1.0

# --live: stream targets live from the laptop (AVP+Motive) instead of the preloaded demo.
# A reference demo is still loaded (assets/BPS/opt-init); its target slots are overwritten
# each step with the live frame. liveAddr = laptop's IP that the desktop SUB connects to.
live: False
liveAddr: 128.178.169.131
livePort: 5555
# liveBuffered: consume EVERY published frame in order (faithful trajectory replay, e.g. with
# mock_publish); false = newest-only/CONFLATE (real-time teleop, may skip frames).
liveBuffered: False
# objectSet: which props are on the table. OFFLINE this is inferred from what the capture recorded,
# so this value is ignored; LIVE there is no pkl to infer from, so it selects the set. It picks the
# assets each hand spawns, the Motive rigid-body names read out of each wire frame, and which body
# (if any) is a non-scored prop.
#   bottle    — OakInk-v2 alcohol burner: LH = bottle_body, RH = bottle_cap, no prop
#   cup_brush — BOTH hands manipulate d2_brush; d2_cup is a prop (spawned and collided with, but
#               never a reward or failure target). Pair with sharedObject=true.
# Sets are defined in main/dataset/object_sets.py.
objectSet: bottle
# recordDemoData: during a live run, write the per-step frame provenance CSV — one row per control
# step of (control_step, seq, t_capture_s, t_step_s, stale, sync_ok), dumped at exit. This is what
# the desktop-side duplicate rate is counted from (consecutive equal seq). CSV ONLY: it never
# captures the viewer, so it costs one tuple append per step and leaves the control rate untouched.
# Each manual reset (N/M) restarts the rows, so the CSV covers exactly the last attempt.
recordDemoData: False
# recordDemoVideo: additionally capture the viewer and encode an mp4 beside the CSV. Requires
# recordDemoData and a viewer (headless: false); off by default, so recordDemoData alone is
# unaffected. EXPENSIVE — capture arms at the FIRST manual reset (N/M) and never disarms, and each
# PNG readback overruns the render branch's pacing budget, halving the live control rate
# 60 Hz -> 30 Hz. Never enable it on a run whose timing you intend to measure: at 30 Hz the sim
# falls behind the 60 Hz publisher, which changes the very frame statistics the CSV is recording.
recordDemoVideo: False
# liveRateOverlay: during a live run, draw the achieved control rate ("59.4 HZ") in yellow at the
# viewer's top-left. Live-only and viewer-only, so it cannot affect training or headless eval.
# On by default because falling behind the 60 Hz stream is the live failure you need to see as it
# happens; set False for a clean recording with nothing burned into the frame. Isaac Gym has no 2D
# text API, so it is drawn as line segments on a billboard in front of the camera -- see
# maniptrans_envs/lib/envs/core/viewer_overlay.py.
liveRateOverlay: True
# residualGateDistance (metres, LIVE play only; -1 = off): hold each hand's residual at zero while
# it reaches, latch it on once that hand's closest fingertip is within this distance of its object.
residualGateDistance: -1.0
# liveResidualCutoff: zero the residual action once the cap is seated on the bottle (live object
# poses within 5 mm vertically and 2 cm in-plane), leaving the frozen imitators in control.
liveResidualCutoff: True
# renderDecimation: draw the viewer only every N-th control step (1 = every step). GL vsync in
# draw_viewer otherwise quantizes each control step to the display refresh, halving the control
# rate; 2 = viewer at 30 Hz with control at 60 Hz (keeps newest-only live streaming real-time).
renderDecimation: 4
# debugVis: viewer debug overlays (green demo skeletons, per-body contact coloring). Costs several
# ms/step in Python at 1 env — set false for real-time live runs.
debugVis: True

# causal: compute demo velocities causally (no look-ahead) instead of the default non-causal
# np.gradient + Gaussian filter. Emulates LiveTargetSource so offline targets match the live
# stream. causalVelMode selects the causal method for LINEAR velocities (angular always vel_ema):
#   pos_ema — low-pass positions (EMA), then backward-diff (smoother; recommended).
#   vel_ema — backward-diff, then EMA the velocity (the original causal path).
# causalEmaAlpha = smoothing strength (position EMA in pos_ema; velocity EMA in vel_ema).
causal: False
causalVelMode: pos_ema
causalEmaAlpha: 0.3

dataIndices: [7]

# seed - set to -1 to choose random seed
seed: 42
# set to True for deterministic performance
torch_deterministic: False

# set the maximum number of learning iterations to train for. overrides default per-environment setting
max_iterations: 9999999999999  # train forever
early_stop_epochs: 9999999999999
# minSaveEpoch: no intermediate checkpoint (periodic or new-best) is written below this epoch.
# The terminal saves (early stop / max_epochs / max_frames) always write, so a short run still
# leaves a .pth behind. Set 0 to restore the old save-from-the-start behaviour.
min_save_epoch: 700

## Device config
#  'physx' or 'flex'
physics_engine: 'physx'
# whether to use cpu or gpu pipeline
pipeline: 'gpu'
# device for running physics simulation
sim_device: 'cuda:0'
# device to run RL
rl_device: 'cuda:0'
graphics_device_id: 0

## PhysX arguments
num_threads: 4 # Number of worker threads per scene used by PhysX - for CPU PhysX only.
solver_type: 1 # 0: pgs, 1: tgs
num_subscenes: 4 # Splits the simulation into N physics scenes and runs each one in a separate thread

# RLGames Arguments
# test - if set, run policy in inference mode (requires setting checkpoint to load)
test: False
# save rollouts config, used for distillation
save_rollouts: False
save_successful_rollouts_only: True
num_rollouts_to_save: 10
num_rollouts_to_run: 10
min_episode_length: 20
# used to set checkpoint path
checkpoint: ''
from_ckpt_epoch: false
# set sigma when restoring network
sigma: ''
# set to True to use multi-gpu training
multi_gpu: False

wandb_activate: False
wandb_group: ''
wandb_name: ${rl_train.params.config.name}
wandb_entity: null  # set to your wandb entity if using wandb
wandb_project: null  # set to your wandb project if using wandb
wandb_tags: []
wandb_logcode_dir: '' 

capture_video: False
n_parallel_recorders: 1
n_successful_videos_to_record: 5
plot_trajectories: False
n_traj_episodes: 10
# Score the eval failure thresholds every step WITHOUT terminating on them, so a rollout that the
# thresholds would have cut short still runs to the end of the demo and reports where it lost the
# trajectory. The eval branch of compute_imitation_reward ends in `failed_execute = error_buf`, so
# those thresholds are dead today — only the velocity sanity check stops a test episode. Turn this
# on (with test=true) and every episode prints the first step at which the thresholds would have
# quit and which term tripped; with capture_video=true it also writes the four scored error series
# as <video-stem>_metrics.{csv,png} next to each mp4, so a video can be read against its error
# curves. Off by default: it adds a printout and two files per recorded episode.
# Bimanual only — dexhandmanip_bih.py implements it; side=RH/LH (dexhandmanip_sh.py) ignores it.
evalThresholdDryRun: False
display: False
headless: True

# set the directory where the output files get saved
hydra:
  output_subdir: null
  run:
    dir: .
